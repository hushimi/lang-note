name: Delete Merged Branch

on:
  pull_request:
    types:
      - closed

jobs:
  delete-merged-branch:
    # Only run when PR is merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged branch
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          PROTECTED_BRANCHES="main master develop"

          # Check if branch is protected
          if echo "$PROTECTED_BRANCHES" | grep -qw "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME is protected. Skipping deletion."
            exit 0
          fi

          # Delete the branch
          echo "Deleting merged branch: $BRANCH_NAME"
          git push origin --delete "$BRANCH_NAME" || echo "Branch $BRANCH_NAME may have already been deleted or doesn't exist."
